<div class="fbd-editor">

  <!-- Toolbar -->
  <div class="fbd-toolbar">
    <span class="fbd-badge">Function Block Diagram (FBD) — IEC 61131-3 Sheet</span>
    <span class="fbd-hint">Click any Input/Output Reference block to toggle live tag state</span>
    <div class="fbd-legend">
      <span class="legend-item"><span class="leg-wire active"></span> Active Signal</span>
      <span class="legend-item"><span class="leg-wire"></span> Inactive</span>
    </div>
  </div>

  <!-- SVG Canvas -->
  <div class="fbd-canvas">
    <svg width="100%" height="100%" viewBox="0 0 960 380" preserveAspectRatio="xMidYMid meet">

      <defs>
        <pattern id="fbd-grid" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f0f0" stroke-width="0.5"/>
        </pattern>
        <pattern id="fbd-grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
          <rect width="100" height="100" fill="url(#fbd-grid)"/>
          <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#e0e0e0" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="#fff"/>
      <rect width="100%" height="100%" fill="url(#fbd-grid-major)"/>

      <!-- Wires -->
      <g *ngFor="let w of wires">
        <path
          [attr.d]="computeWirePath(w)"
          fill="none"
          [attr.stroke]="w.active ? '#28a745' : '#bbb'"
          [attr.stroke-width]="w.active ? 2.5 : 1"
          stroke-linecap="round"
        />
        <circle *ngIf="w.active"
          [attr.cx]="getWireMidX(w)"
          [attr.cy]="getWireMidY(w)"
          r="3.5" fill="#28a745" opacity="0.8"
        />
      </g>

      <!-- Blocks -->
      <g *ngFor="let node of nodes"
        [attr.transform]="'translate(' + node.x + ',' + node.y + ')'"
        class="fbd-block"
        (click)="onNodeClick(node)"
        style="cursor:pointer">

        <!-- Block Body -->
        <rect width="180" height="56" rx="3"
          [attr.fill]="node.state ? '#e8f5e9' : '#f5f5f5'"
          [attr.stroke]="node.state ? '#28a745' : (node.type === 'AND' || node.type === 'OR' ? '#1a3a5c' : '#bbb')"
          stroke-width="1.5"
        />

        <!-- Block Type Label -->
        <text x="10" y="18"
          [attr.fill]="node.type === 'INPUT_REF' ? '#1a3a5c' : node.type === 'OUTPUT_REF' ? '#28a745' : '#6f42c1'"
          font-size="10" font-family="Consolas,monospace" font-weight="600">
          {{ node.type === 'INPUT_REF' ? 'INPUT REF' : node.type === 'OUTPUT_REF' ? 'OUTPUT REF' : node.type }}
        </text>

        <!-- Block Name -->
        <text x="10" y="38"
          [attr.fill]="node.state ? '#28a745' : '#333'"
          font-size="11" font-family="Consolas,monospace">
          {{ node.label }}
        </text>

        <!-- Status LED -->
        <circle cx="166" cy="12" r="5"
          [attr.fill]="node.state ? '#28a745' : '#ccc'"
          [attr.stroke]="node.state ? '#28a745' : '#bbb'"
          stroke-width="1"
        />
        <circle *ngIf="node.state" cx="166" cy="12" r="8"
          fill="none" stroke="#28a745" stroke-width="1" opacity="0.3"
        />

        <!-- Connection Ports -->
        <circle cx="0" cy="28" r="4"
          [attr.fill]="node.state ? '#28a745' : '#bbb'"
          stroke="#fff" stroke-width="1"
        />
        <circle cx="180" cy="28" r="4"
          [attr.fill]="node.state ? '#28a745' : '#bbb'"
          stroke="#fff" stroke-width="1"
        />
      </g>
    </svg>
  </div>
</div>
